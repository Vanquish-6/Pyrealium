name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  emulator:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher and run validation
        shell: powershell
        run: .\launcher\build.ps1
