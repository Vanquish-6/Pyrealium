[package]
name = "pyrealium"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Evidence-driven AC2 build 7148 local emulator"
license = "AGPL-3.0-only"
repository = "https://github.com/Vanquish-6/Pyrealium"

[dependencies]
argon2 = "0.5.3"
getrandom = "0.2.16"
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
zeroize = "1.8"

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "scene"
harness = false

[profile.release]
overflow-checks = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
